# Neural hybrid + cross-encoder reranking of the top 50. Requires the `neural` extra.
chunking: {max_words: 10000, overlap_sentences: 0}
retrieval:
  method: hybrid
  bm25: {k1: 1.5, b: 0.3}
  dense:
    backend: sentence-transformers
    model: BAAI/bge-small-en-v1.5
  fusion: {method: rrf, weights: [0.5, 0.5], rrf_k: 60, candidates: 100}
  rerank:
    backend: cross-encoder
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidates: 50
generation:
  model: claude-opus-5-5
  effort: medium
  context_chunks: 5
